<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Group Chat & Document Editor</title>
    <link rel="icon" href="/static/icons/chat.png" type="image/png">
    <link href="/static/quill/quill2.snow.css" rel="stylesheet">
    <link href="/static/quill/quill-better-table.css" rel="stylesheet">
    <script src="/static/quill/quill2.min.js"></script>
    <script src="/static/quill/quill-better-table2.min.js"></script>
    <script>
        // Register better-table module BEFORE Quill is initialized
        if (typeof Quill !== 'undefined' && typeof quillBetterTable !== 'undefined') {
            Quill.register({
                'modules/better-table': quillBetterTable.default || quillBetterTable
            }, true);
        }
    </script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #64748b;
            --accent: #10b981;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --error: #ef4444;
            --user-bg: #dbeafe;
            --assistant-bg: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--background);
        }

        .header h1 {
            font-size: 18px;
            margin: 0;
            margin-right: 16px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            margin-right: auto;
        }

        .settings-btn {
            margin-left: auto;
        }

        .header-icon {
            width: 16px;
            height: 16px;
            margin-right: 6px;
            vertical-align: middle;
        }

        .btn-icon-white {
            width: 16px;
            height: 16px;
            margin-right: 6px;
            vertical-align: middle;
            filter: brightness(0) invert(1);
        }

        /* Conversations Sidebar */
        .conversations-sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: none;
            flex-direction: column;
        }

        .conversations-sidebar.active {
            display: flex;
        }

        .conversations-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .conversations-header h3 {
            font-size: 14px;
            margin: 0;
        }

        .close-sidebar {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px 8px;
        }

        .close-sidebar:hover {
            color: var(--text);
        }
        
        .header-left {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .clear-history-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: background-color 0.2s;
            margin-left: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .clear-history-btn img {
            width: 16px;
            height: 16px;
            color: #ef4444;
            filter: invert(25%) sepia(80%) saturate(1500%) hue-rotate(350deg);
            vertical-align: middle;
            margin-top: 2px;
        }
        
        .clear-history-btn:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }
        
        .clear-history-btn:active {
            background-color: rgba(239, 68, 68, 0.2);
            transform: scale(0.95);
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .conversation-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .conversation-item:hover {
            background: var(--background);
        }

        .conversation-item.active {
            background: var(--primary);
            color: white;
        }

        .conversation-content {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .conversation-delete {
            opacity: 0;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            color: inherit;
            transition: all 0.2s;
        }

        .conversation-item:hover .conversation-delete {
            opacity: 0.5;
        }

        .conversation-delete:hover {
            opacity: 1 !important;
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--background);
        }

        .btn-icon {
            padding: 8px;
            background: transparent;
            border: 1px solid var(--border);
        }

        /* Main Layout */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Chat Panel */
        .chat-panel {
            width: 40%;
            min-width: 350px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--surface);
        }

        .chat-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .chat-header h2 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .model-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .model-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--background);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .model-checkbox:hover {
            border-color: #ccc;
        }

        .model-checkbox.active {
            border-color: var(--primary);
            color: var(--text);
        }

        .model-checkbox input {
            display: none;
        }

        .model-checkbox .model-icon {
            width: 16px;
            height: 16px;
            display: inline-block;
            vertical-align: middle;
        }

        .model-checkbox .model-icon img,
        .model-checkbox .model-icon svg {
            width: 100%;
            height: 100%;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #fafbfc;
        }

        .message {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            position: relative;
        }

        .message-user {
            background: var(--user-bg);
            margin-left: auto;
            border: 1px solid rgba(37, 99, 235, 0.15);
        }

        .message-assistant {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .message-model {
            font-weight: normal;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .message-avatar {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            display: inline-block;
            vertical-align: middle;
            margin-right: 4px;
            max-width: 16px;
            max-height: 16px;
        }

        .message-avatar img,
        .message-avatar svg {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .message-author {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .message-content {
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .message-content code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 13px;
            color: #dc2626;
            border: 1px solid #e2e8f0;
        }
        
        .message-content pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        
        .message-content blockquote {
            border-left: 3px solid #94a3b8;
            padding-left: 12px;
            margin: 8px 0;
            color: #64748b;
        }
        
        .message-content strong {
            color: #1e293b;
        }
        
        .table-wrapper {
            overflow-x: auto;
            margin: 12px 0;
        }
        
        .markdown-table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
            font-size: 14px;
        }
        
        .markdown-table th,
        .markdown-table td,
        .ql-editor .markdown-table th,
        .ql-editor .markdown-table td {
            border: 1px solid #ddd !important;
            padding: 8px 12px;
            text-align: left;
        }
        
        .markdown-table th,
        .ql-editor .markdown-table th {
            background-color: #f5f5f5 !important;
            font-weight: 600;
        }
        
        .markdown-table tr:nth-child(even),
        .ql-editor .markdown-table tr:nth-child(even) {
            background-color: #fafafa;
        }
        
        .markdown-table tr:hover,
        .ql-editor .markdown-table tr:hover {
            background-color: #f0f0f0;
        }

        .thinking-section {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .thinking-header {
            font-weight: 600;
            color: #64748b;
            margin-bottom: 6px;
        }

        .thinking-content {
            color: #475569;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        .message-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .message-btn {
            padding: 4px 8px;
            font-size: 11px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
        }

        .message-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .chat-input-area {
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .chat-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            font-family: inherit;
            min-height: 80px;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .chat-input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .chat-hint {
            font-size: 12px;
            color: var(--text-muted);
        }

        .send-btn {
            padding: 8px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .send-btn:disabled {
            background: var(--secondary);
            cursor: not-allowed;
        }

        .stop-btn {
            padding: 8px 20px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .stop-btn:hover {
            background: #dc2626;
        }

        .chat-actions {
            display: flex;
            gap: 8px;
        }

        .discuss-btn {
            background: #10a37f;
        }

        .discuss-btn:hover {
            background: #0d8a6b;
        }

        /* Editor Panel */
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
        }

        .editor-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .doc-title {
            flex: 1;
            font-size: 16px;
            border: none;
            outline: none;
            font-weight: 500;
            color: var(--text-muted);
        }

        .doc-status {
            font-size: 12px;
            color: var(--text-muted);
        }

        .doc-status.saving {
            color: var(--accent);
        }

        /* Quill Editor Customization */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #editor {
            flex: 1;
            overflow-y: auto;
        }

        .ql-toolbar {
            border: none !important;
            border-bottom: 1px solid var(--border) !important;
            background: var(--background);
        }

        .ql-container {
            border: none !important;
            font-family: inherit;
            font-size: 14px;
        }

        .ql-editor {
            min-height: 300px;
            padding: 20px 40px;
        }

        .ql-editor.ql-blank::before {
            font-style: normal;
            color: var(--text-muted);
        }

        .editor-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copyright {
            font-size: 10px;
            color: var(--text-muted);
        }

        .editor-actions {
            display: flex;
            gap: 8px;
        }

        .copyright {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Document List Sidebar */
        .doc-sidebar {
            width: 220px;
            border-left: 1px solid var(--border);
            background: var(--background);
            display: flex;
            flex-direction: column;
        }

        .doc-sidebar-header {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .doc-sidebar-header h3 {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .doc-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .doc-item:hover {
            background: var(--surface);
        }

        .doc-item.active {
            background: var(--primary);
            color: white;
        }

        .doc-item-content {
            flex: 1;
            min-width: 0;
        }

        .doc-item-title {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-item-date {
            font-size: 11px;
            opacity: 0.7;
        }

        .doc-delete-btn {
            opacity: 0;
            background: none;
            border: none;
            color: inherit;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
            line-height: 1;
        }

        .doc-item:hover .doc-delete-btn {
            opacity: 0.5;
        }

        .doc-delete-btn:hover {
            opacity: 1 !important;
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow: hidden;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-body {
            padding: 20px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: var(--text);
            color: white;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 1001;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background: var(--accent);
        }

        .toast.error {
            background: var(--error);
        }

        /* Resizer */
        .resizer {
            width: 4px;
            cursor: col-resize;
            background: var(--border);
            transition: background 0.2s;
        }

        .resizer:hover {
            background: var(--primary);
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            padding: 40px;
            text-align: center;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            margin-bottom: 8px;
            color: var(--text);
        }

        /* Model Settings */
        .model-settings-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .model-setting-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--background);
            border-radius: 8px;
        }

        .model-setting-item .model-checkbox {
            flex-shrink: 0;
        }

        .model-setting-item .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .model-setting-item input[type="password"] {
            width: 100%;
        }

        .model-setting-item label {
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .model-setting-block {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .model-setting-block .model-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: normal;
            cursor: pointer;
        }

        .model-setting-block .model-label input[type="checkbox"] {
            margin: 0;
            width: 14px;
            height: 14px;
        }

        .model-setting-block .model-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
            vertical-align: middle;
        }

        .model-setting-block .model-icon svg {
            width: 100%;
            height: 100%;
        }

        .model-setting-block .api-status {
            color: #4CAF50;
            font-weight: bold;
            margin-left: 5px;
        }

        .model-setting-block .api-key-input {
            width: 100%;
            padding: 10px 12px;
            font-size: 13px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>AI Group Chat</h1>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="toggleConversations()" title="History"><img src="/static/icons/chat-history-line.svg" class="header-icon" alt="History">History</button>
            <button class="btn btn-secondary" onclick="newConversation()" title="New Chat"><img src="/static/icons/chat-new-line.svg" class="header-icon" alt="New Chat">New Chat</button>
        </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // Global state
        let currentConversationId = null;
        let currentDocumentId = null;
        let selectedModels = ['openai'];
        let availableModels = [];
        let quill = null;
        let autoSaveTimer = null;
        
        // Discuss mode state
        let isDiscussMode = false;
        let isStoppingDiscuss = false;
        let discussAbortController = null;
        let discussInstanceId = 0; // Track current discussion instance
        let discussModels = [];
        let discussMessage = '';
        let discussCurrentRound = 0;
        let maxDiscussRounds = 20; // Maximum rounds as safety limit
        let lastDiscussionSummary = '';
        let currentRespondingModel = ''; // Track current responding model
        let conclusionReachedModels = []; // Track models that have reached conclusion

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('discussBtn').onclick = startDiscuss;
            initEditor();
            await loadModels();
            await loadSettings();
            await loadDocuments();
            initResizer();
            initKeyboardShortcuts();
        });

        // Conversations
        function toggleConversations() {
            const sidebar = document.getElementById('conversationsSidebar');
            sidebar.classList.toggle('active');
            if (sidebar.classList.contains('active')) {
                loadConversations();
            } else {
                // 关闭侧边栏时移除历史视图标记
                document.getElementById('chatMessages').classList.remove('history-view');
            }
        }

        async function loadConversations() {
            try {
                const response = await fetch('/api/conversations');
                const conversations = await response.json();
                renderConversationsList(conversations);
            } catch (error) {
                console.error('Failed to load conversations:', error);
            }
        }
        
        async function clearAllConversations() {
            if (!confirm('Are you sure you want to delete all conversations? This action cannot be undone.')) {
                return;
            }
            try {
                const response = await fetch('/api/conversations/clear', {
                    method: 'DELETE'
                });
                if (response.ok) {
                    showToast('All conversations cleared', 'success');
                    loadConversations();
                }
            } catch (error) {
                console.error('Failed to clear conversations:', error);
                showToast('Failed to clear conversations', 'error');
            }
        }

        async function loadDocuments() {
            try {
                const response = await fetch('/api/documents');
                const documents = await response.json();
                renderDocList(documents);
            } catch (error) {
                console.error('Failed to load documents:', error);
            }
        }

        function renderConversationsList(conversations) {
            const container = document.getElementById('conversationsList');
            if (conversations.length === 0) {
                container.innerHTML = '<p style="padding: 16px; color: var(--text-muted); font-size: 13px;">No conversations yet</p>';
                return;
            }
            container.innerHTML = conversations.map(conv => `
                <div class="conversation-item ${currentConversationId === conv._id ? 'active' : ''}">
                    <div class="conversation-content" onclick="loadConversation('${conv._id}')">
                        ${conv.title || 'Untitled'}
                    </div>
                    <button class="conversation-delete" onclick="deleteConversation('${conv._id}', event)" title="Delete conversation">×</button>
                </div>
            `).join('');
        }

        async function deleteConversation(convId, event) {
            event.stopPropagation();
            if (!confirm('Delete this conversation?')) return;
            try {
                await fetch(`/api/conversations/${convId}`, { method: 'DELETE' });
                if (currentConversationId === convId) {
                    newConversation();
                }
                await loadConversations();
                showToast('Conversation deleted', 'success');
            } catch (error) {
                showToast('Failed to delete: ' + error.message, 'error');
            }
        }

        async function loadConversation(convId) {
            try {
                const response = await fetch(`/api/conversations/${convId}`);
                const conv = await response.json();
                currentConversationId = convId;
                renderConversationMessages(conv.messages || []);
                // 重新渲染历史列表以更新 active 状态
                loadConversations();
            } catch (error) {
                showToast('Failed to load conversation: ' + error.message, 'error');
            }
        }

        function renderConversationMessages(messages) {
            const container = document.getElementById('chatMessages');
            // 添加标记表示正在显示历史记录
            container.classList.add('history-view');
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <h3>Start a Conversation</h3>
                        <p>Select models and send your first message</p>
                    </div>
                `;
                return;
            }
            container.innerHTML = '';
            messages.forEach(msg => {
                if (msg.role === 'user') {
                    addMessageToChat('user', msg.content);
                } else {
                    addMessageToChat('assistant', msg.content, msg.model);
                }
            });
        }

        function newConversation() {
            currentConversationId = null;
            const container = document.getElementById('chatMessages');
            container.classList.remove('history-view');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <h3>Start a Conversation</h3>
                    <p>Select models and send your first message</p>
                </div>
            `;
        }

        // Fix Quill toolbar accessibility
        function fixQuillAccessibility() {
            const toolbar = document.querySelector('.ql-toolbar');
            if (!toolbar) return;
            
            const buttonTitles = {
                'bold': 'Bold',
                'italic': 'Italic',
                'underline': 'Underline',
                'list': 'List'
            };
            
            // Fix all buttons
            toolbar.querySelectorAll('button').forEach(btn => {
                if (!btn.title) {
                    for (const [cls, title] of Object.entries(buttonTitles)) {
                        if (btn.classList.contains('ql-' + cls)) {
                            btn.title = title;
                            break;
                        }
                    }
                }
            });
            
            // Fix all inputs
            toolbar.querySelectorAll('input').forEach(input => {
                if (!input.title && input.type === 'text') {
                    input.title = 'Enter URL';
                }
            });
        }
        
        // Also fix periodically in case Quill recreates elements
        setInterval(fixQuillAccessibility, 1000);

        // Quill Editor
        function initEditor() {
            // Get better-table keyboard bindings if available
            let keyboardBindings = {};
            try {
                if (Quill.import('modules/better-table')) {
                    keyboardBindings = Quill.import('modules/better-table').keyboardBindings;
                }
            } catch (e) {
                // better-table not loaded yet
            }
            
            quill = new Quill('#editor', {
                theme: 'snow',
                placeholder: 'Start writing your document...',
                modules: {
                    toolbar: {
                        container: [
                            ['bold', 'italic', 'underline'],
                            [{ 'header': [1, 2, 3, false] }],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            [{ 'align': [] }],
                            ['table']
                        ],
                        handlers: {
                            'table': function() {
                                let tableModule = quill.getModule('better-table');
                                if (tableModule && tableModule.table) {
                                    return;
                                }
                                const range = quill.getSelection();
                                if (tableModule) {
                                    tableModule.insertTable(3, 3);
                                }
                            }
                        }
                    },
                    'better-table': {
                        language: 'en_US'
                    },
                    keyboard: {
                        bindings: keyboardBindings
                    }
                }
            });
            
            // Add table operation buttons after Quill initialization
            setTimeout(function() {
                const toolbar = document.querySelector('.ql-toolbar');
                if (!toolbar) return;
                
                // Create row operation buttons
                const rowOps = document.createElement('span');
                rowOps.className = 'ql-formats';
                rowOps.innerHTML = `
                    <button type="button" class="ql-tableOp" data-op="insertRowBelow" title="增加行">
                        <img src="/static/icons/增加行.svg" style="width:16px;height:16px;" alt="增加行">
                    </button>
                    <button type="button" class="ql-tableOp" data-op="deleteRow" title="删除行">
                        <img src="/static/icons/删除行.svg" style="width:16px;height:16px;" alt="删除行">
                    </button>
                `;
                
                // Create column operation buttons
                const colOps = document.createElement('span');
                colOps.className = 'ql-formats';
                colOps.innerHTML = `
                    <button type="button" class="ql-tableOp" data-op="insertColumnRight" title="增加列">
                        <img src="/static/icons/增加列.svg" style="width:16px;height:16px;" alt="增加列">
                    </button>
                    <button type="button" class="ql-tableOp" data-op="deleteColumn" title="删除列">
                        <img src="/static/icons/删除列.svg" style="width:16px;height:16px;" alt="删除列">
                    </button>
                `;
                
                // Style the buttons
                const btnStyle = document.createElement('style');
                btnStyle.textContent = `
                    .ql-tableOp {
                        padding: 4px 6px !important;
                        cursor: pointer;
                        border: 1px solid transparent !important;
                        background: transparent !important;
                        margin: 0 2px !important;
                        display: inline-flex !important;
                        align-items: center !important;
                        justify-content: center !important;
                    }
                    .ql-tableOp:hover {
                        background: #e5e7eb !important;
                        border-radius: 4px;
                    }
                    .ql-tableOp img {
                        display: block;
                    }
                `;
                document.head.appendChild(btnStyle);
                
                // Add buttons to toolbar
                toolbar.appendChild(rowOps);
                toolbar.appendChild(colOps);
                
                // Click handlers for row/col buttons
                toolbar.querySelectorAll('.ql-tableOp').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        const op = btn.getAttribute('data-op');
                        const tableModule = quill.getModule('better-table');
                        if (!tableModule || !tableModule.table) {
                            alert('请先点击表格内的单元格');
                            return;
                        }
                        
                        // Get table blot (Quill object) from DOM element
                        const tableBlot = Quill.find(tableModule.table);
                        const tableSelection = tableModule.tableSelection;
                        const scrollContainer = quill.root.parentNode;
                        
                        if (!tableBlot) {
                            alert('无法获取表格对象');
                            return;
                        }
                        
                        if (op === 'insertRowBelow') {
                            // Insert row below
                            const rows = tableBlot.insertRow(tableSelection.boundary, true, scrollContainer);
                            quill.update(Quill.sources.USER);
                            if (rows && rows[0]) {
                                quill.setSelection(quill.getIndex(rows[0]), 0, Quill.sources.SILENT);
                            }
                        } else if (op === 'deleteRow') {
                            // Delete row
                            tableBlot.deleteRow(tableSelection.boundary, scrollContainer);
                            quill.update(Quill.sources.USER);
                            tableSelection.clearSelection();
                        } else if (op === 'insertColumnRight') {
                            // Insert column to the right
                            const colIndex = tableModule.columnTool ? 
                                tableModule.columnTool.colToolCells().findIndex(cell => {
                                    const rect = cell.getBoundingClientRect();
                                    const boundary = tableSelection.boundary;
                                    return rect.x <= boundary.x + boundary.width/2;
                                }) : 0;
                            // insertColumn(boundary, index, insertRight, scrollContainer)
                            const cols = tableBlot.insertColumn(tableSelection.boundary, Math.max(0, colIndex), true, scrollContainer);
                            if (tableModule.tableColumnTool) {
                                tableModule.tableColumnTool.updateToolCells();
                            }
                            quill.update(Quill.sources.USER);
                            if (cols && cols[0]) {
                                quill.setSelection(quill.getIndex(cols[0]), 0, Quill.sources.SILENT);
                            }
                        } else if (op === 'deleteColumn') {
                            // Delete column - find column index from selected cells
                            const selectedTds = tableSelection.selectedTds;
                            if (!selectedTds || selectedTds.length === 0) {
                                alert('请先选择要删除的列（拖动选择单元格）');
                                return;
                            }
                            
                            // Get column index from the first selected cell
                            const firstCell = selectedTds[0];
                            const cellRect = firstCell.domNode.getBoundingClientRect();
                            
                            // Find column index using column tool cells
                            let colIndex = -1;
                            if (tableModule.columnTool) {
                                const columnToolCells = tableModule.columnTool.colToolCells();
                                for (let i = 0; i < columnToolCells.length; i++) {
                                    const cell = columnToolCells[i];
                                    const rect = cell.getBoundingClientRect();
                                    // Match the column based on position
                                    if (Math.abs(rect.x - cellRect.x) < 5) {
                                        colIndex = i;
                                        break;
                                    }
                                }
                            }
                            
                            // Fallback: calculate from cell position
                            if (colIndex < 0 && firstCell.domNode) {
                                // Try to get cell index from td attributes
                                const cellIndex = firstCell.domNode.getAttribute('data-cell');
                                if (cellIndex) {
                                    colIndex = parseInt(cellIndex, 10) - 1;
                                }
                            }
                            
                            if (colIndex >= 0) {
                                tableBlot.deleteColumns(tableSelection.boundary, [colIndex], scrollContainer);
                                if (tableModule.tableColumnTool) {
                                    tableModule.tableColumnTool.updateToolCells();
                                }
                                quill.update(Quill.sources.USER);
                                tableSelection.clearSelection();
                            } else {
                                alert('无法确定要删除的列');
                            }
                        }
                    });
                });
            }, 100);
            
            // Fix Quill toolbar accessibility
            setTimeout(fixQuillAccessibility, 100);

            // Auto-save on change
            quill.on('text-change', () => {
                if (currentDocumentId) {
                    scheduleAutoSave();
                }
            });
        }

        function scheduleAutoSave() {
            clearTimeout(autoSaveTimer);
            updateDocStatus('Unsaved changes...');
            autoSaveTimer = setTimeout(() => {
                if (currentDocumentId) {
                    saveDocument(true);
                }
            }, 30000);
        }

        function updateDocStatus(text) {
            const status = document.getElementById('docStatus');
            status.textContent = text;
            status.classList.toggle('saving', text.includes('Saving') || text.includes('saved'));
        }

        // API Calls
        async function loadModels() {
            try {
                const response = await fetch('/api/models');
                allModels = await response.json();

                // Get enabled models from settings
                const settingsResponse = await fetch('/api/settings');
                const settings = await settingsResponse.json();

                // Use enabled_models if available, otherwise fall back to configured models
                if (settings.enabled_models && settings.enabled_models.length > 0) {
                    selectedModels = settings.enabled_models;
                } else {
                    // Fallback: use models with configured API keys
                    selectedModels = Object.entries(settings.api_keys || {})
                        .filter(([_, configured]) => configured)
                        .map(([model, _]) => model);
                }

                renderModelSelector();
            } catch (error) {
                console.error('Failed to load models:', error);
            }
        }

        async function loadSettings() {
            try {
                const response = await fetch('/api/settings');
                currentSettings = await response.json();
                // Keep selectedModels in sync with enabled models
                if (currentSettings.enabled_models && currentSettings.enabled_models.length > 0) {
                    selectedModels = currentSettings.enabled_models;
                }
                renderModelSelector();
            } catch (error) {
                console.error('Failed to load settings:', error);
            }
        }

        async function loadDocuments() {
            try {
                const response = await fetch('/api/documents');
                const documents = await response.json();
                renderDocList(documents);
            } catch (error) {
                console.error('Failed to load documents:', error);
            }
        }

        // Render functions
        function renderModelSelector() {
            const container = document.getElementById('modelSelector');

            // Get enabled models from currentSettings
            const enabledModelIds = currentSettings?.enabled_models || [];

            // Filter to only show enabled models
            const enabledModels = allModels.filter(m => enabledModelIds.includes(m.id));

            if (enabledModels.length === 0) {
                container.innerHTML = '<span style="color: var(--text-muted); font-size: 13px;">No models enabled</span>';
                return;
            }

            // Show enabled models, mark selected ones as active
            container.innerHTML = enabledModels.map(model => {
                const isActive = selectedModels.includes(model.id);
                return `
                <div class="model-checkbox ${isActive ? 'active' : ''}" data-model="${model.id}">
                    ${renderIcon(model.icon)} ${model.name}
                </div>
            `}).join('');

            // Add click handlers to the divs
            container.querySelectorAll('.model-checkbox').forEach(el => {
                el.addEventListener('click', () => {
                    el.classList.toggle('active');

                    // Update selected models based on active state
                    selectedModels = Array.from(container.querySelectorAll('.model-checkbox.active'))
                        .map(el => el.dataset.model);
                });
            });
        }

        function renderDocList(documents) {
            const container = document.getElementById('docList');
            if (documents.length === 0) {
                container.innerHTML = '<div class="empty-state" style="padding: 20px;"><p>No documents yet</p></div>';
                return;
            }
            container.innerHTML = documents.map(doc => `
                <div class="doc-item ${currentDocumentId === doc._id ? 'active' : ''}">
                    <div class="doc-item-content" onclick="loadDocument('${doc._id}')">
                        <div class="doc-item-title">${doc.title}</div>
                        <div class="doc-item-date">${formatDate(doc.updated_at)}</div>
                    </div>
                    <button class="doc-delete-btn" onclick="deleteDocument('${doc._id}', event)" title="Delete">×</button>
                </div>
            `).join('');
        }

        async function deleteDocument(docId, event) {
            event.stopPropagation();
            if (!confirm('Are you sure you want to delete this document?')) return;

            try {
                await fetch(`/api/documents/${docId}`, { method: 'DELETE' });
                if (currentDocumentId === docId) {
                    currentDocumentId = null;
                    quill.setContents([]);
                    document.getElementById('docTitle').value = '';
                    updateDocStatus('');
                }
                await loadDocuments();
                showToast('Document deleted', 'success');
            } catch (error) {
                showToast('Failed to delete: ' + error.message, 'error');
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false,
                timeZoneName: 'short'
            });
        }

        function addMessageToChat(role, content, model = null) {
            const container = document.getElementById('chatMessages');
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const message = document.createElement('div');
            // 在历史视图中隐藏用户消息
            const roleClass = (role === 'user' && container.classList.contains('history-view')) 
                ? '' 
                : `message-${role}`;
            message.className = roleClass ? `message ${roleClass}` : 'message';
            const header = model ? `<div class="message-header"><span class="message-model">${getModelIcon(model)}<span style="color: ${getModelColor(model)}">${model}</span></span></div>` : '';
            const actions = role === 'assistant' && model ? `
                <div class="message-actions">
                    <button class="message-btn" onclick="copyMessage(this)" title="Copy">Copy</button>
                    <button class="message-btn" onclick="insertToEditor(this)" title="Insert to Editor">Insert</button>
                </div>
            ` : '';

            message.innerHTML = `
                ${header}
                <div class="message-content">${cleanMarkdown(content)}</div>
                ${actions}
            `;
            container.appendChild(message);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function cleanMarkdown(text) {
            // 使用占位符保护已转换的 HTML 表格
            const tablePlaceholders = [];
            
            // 先转换 Markdown 表格为 HTML
            text = convertMarkdownTables(text);
            
            // 提取并保护 HTML 表格
            text = text.replace(/<div class="table-wrapper">[\s\S]*?<\/div>/g, (match) => {
                const placeholder = `__TABLE_PLACEHOLDER_${tablePlaceholders.length}__`;
                tablePlaceholders.push(match);
                return placeholder;
            });
            
            // 在转义之前移除 Markdown 格式符号
            text = text
                .replace(/^#{1,6}\s*/gm, '') // 移除标题符号
                .replace(/^>\s*/gm, '') // 移除引用符号
                .replace(/^[-*+]\s+/gm, '') // 移除列表符号
                .replace(/^\d+\.\s+/gm, ''); // 移除有序列表符号
            
            // 转义剩余的 HTML
            text = escapeHtml(text);
            
            // 还原表格占位符
            tablePlaceholders.forEach((table, index) => {
                text = text.replace(`__TABLE_PLACEHOLDER_${index}__`, table);
            });
            
            // 将换行符转换为 <br>
            text = text.replace(/\n/g, '<br>');
            
            // 保留粗体、斜体、代码格式
            return text
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>') // 保留粗体
                .replace(/\*([^*]+)\*/g, '<em>$1</em>') // 保留斜体
                .replace(/__([^_]+)__/g, '<strong>$1</strong>') // 保留粗体
                .replace(/_([^_]+)_/g, '<em>$1</em>') // 保留斜体
                .replace(/`([^`]+)`/g, '<code>$1</code>'); // 保留行内代码
        }
        
        function convertMarkdownTables(text) {
            // 匹配 Markdown 表格（需要先反转义 | 符号）
            const tableRegex = /\|(.+)\|\n\|[-:\s|]+\|\n((?:\|.+\|\n?)+)/g;
            
            return text.replace(tableRegex, (match, headerRow, bodyRows) => {
                // 反转义 | 符号
                headerRow = headerRow.replace(/&vert;/g, '|');
                bodyRows = bodyRows.replace(/&vert;/g, '|');
                
                // 解析表头
                const headers = headerRow.split('|').filter(cell => cell.trim()).map(cell => cell.trim());
                
                // 解析表格内容
                const rows = bodyRows.trim().split('\n').map(row => 
                    row.split('|').filter(cell => cell.trim()).map(cell => cell.trim())
                );
                
                // 生成 HTML 表格
                let html = '<div class="table-wrapper"><table class="markdown-table">';
                
                // 表头
                html += '<thead><tr>';
                headers.forEach(header => {
                    html += `<th>${header}</th>`;
                });
                html += '</tr></thead>';
                
                // 表格内容
                html += '<tbody>';
                rows.forEach(row => {
                    html += '<tr>';
                    row.forEach(cell => {
                        html += `<td>${cell}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody></table></div>';
                
                return html;
            });
        }

        // Chat functions
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message) return;
            if (isDiscussMode) {
                showToast('Discussion in progress. Please wait for it to end.', 'error');
                return;
            }
            if (selectedModels.length === 0) {
                showToast('Please select at least one model', 'error');
                return;
            }

            const sendBtn = document.getElementById('sendBtn');
            let isStreaming = true;
            let abortController = null;
            
            // Change to stop button
            sendBtn.className = 'send-btn stop-btn';
            sendBtn.innerHTML = '<img src="/static/icons/chat-off-line.svg" class="btn-icon-white" alt="Stop">Stop';
            sendBtn.onclick = () => {
                isStreaming = false;
                if (abortController) {
                    abortController.abort();
                }
            };

            // Clear input immediately
            input.value = '';

            // Add user message
            addMessageToChat('user', message);

            try {
                // Create conversation if needed
                if (!currentConversationId) {
                    const convResponse = await fetch('/api/conversations', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: message.substring(0, 50) })
                    });
                    const conv = await convResponse.json();
                    currentConversationId = conv.id;
                }

                // Use streaming API
                abortController = new AbortController();
                const response = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        models: selectedModels,
                        conversation_id: currentConversationId
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                // Track streaming state for each model (use lowercase for consistency with backend)
                const modelStates = {};
                selectedModels.forEach(model => {
                    const key = model.toLowerCase();
                    modelStates[key] = { content: '', element: null, done: false };
                });

                let currentModel = null;
                let buffer = '';

                while (isStreaming) {
                    const { done, value } = await reader.read();
                    if (done || !isStreaming) break;

                    buffer += decoder.decode(value, { stream: true });
                    
                    // Process complete events
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('event: ')) {
                            // Don't reset currentModel here, keep it for the next data line
                        } else if (line.startsWith('data: ')) {
                            const data = line.slice(6).trim();
                            if (!data) continue;
                            
                            try {
                                const json = JSON.parse(data);
                                
                                if (json.model) {
                                    const modelKey = json.model.toLowerCase();
                                    currentModel = modelKey;
                                    if (modelStates[modelKey] && !modelStates[modelKey].element) {
                                        modelStates[modelKey].element = addStreamingMessage('assistant', '', json.model);
                                    }
                                }
                                
                                if (json.content !== undefined && currentModel && modelStates[currentModel]) {
                                    modelStates[currentModel].content += json.content;
                                    if (modelStates[currentModel].element) {
                                        const contentDiv = modelStates[currentModel].element.querySelector('.message-content');
                                        const content = modelStates[currentModel].content;
                                        const modelKey = currentModel;
                                        if (contentDiv) {
                                            // Use innerHTML for streaming to render tables
                                            contentDiv.innerHTML = cleanMarkdown(content);
                                            // Force reflow to ensure rendering
                                            void contentDiv.offsetHeight;
                                        }
                                        modelStates[modelKey].element.scrollIntoView({ behavior: 'smooth', block: 'end' });
                                    }
                                }
                                
                                if (json.full_content !== undefined && currentModel && modelStates[currentModel]) {
                                    const cleanContent = cleanMarkdown(json.full_content);
                                    modelStates[currentModel].content = cleanContent;
                                    if (modelStates[currentModel].element) {
                                        modelStates[currentModel].element.querySelector('.message-content').innerHTML = cleanContent;
                                        modelStates[currentModel].done = true;
                                    }
                                    currentModel = null; // Reset after processing full_content
                                }
                            } catch (e) {
                                // Skip malformed JSON
                            }
                        }
                    }
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    showToast('Failed to send message: ' + error.message, 'error');
                }
            } finally {
                // Reset to send button
                sendBtn.className = 'send-btn';
                sendBtn.innerHTML = '<img src="/static/icons/chat-send-line.svg" class="btn-icon-white" alt="Send">Send';
                sendBtn.onclick = sendMessage;
                isStreaming = false;
            }
        }



        // Discuss mode functions
        async function startDiscuss() {
            // Wait for any ongoing stop operation to complete
            if (isStoppingDiscuss) {
                while (isStoppingDiscuss) {
                    await new Promise(resolve => setTimeout(resolve, 50));
                }
            }
            
            // Prevent starting a new discussion while already in one
            if (isDiscussMode) {
                return;
            }
            
            const message = document.getElementById('chatInput').value.trim();
            const input = document.getElementById('chatInput');
            
            if (!message) {
                showToast('Please enter a topic to discuss', 'error');
                return;
            }
            
            if (selectedModels.length < 2) {
                showToast('Please select at least 2 models for discussion', 'error');
                return;
            }
            
            const discussBtn = document.getElementById('discussBtn');
            const sendBtn = document.getElementById('sendBtn');

            // Start discuss mode
            isStoppingDiscuss = false;
            discussAbortController = new AbortController();
            discussInstanceId++;
            const currentInstanceId = discussInstanceId;
            isDiscussMode = true;
            discussMessage = message;
            discussModels = [...selectedModels];
            discussCurrentRound = 0;
            conclusionReachedModels = [];
            
            // Update UI
            discussBtn.className = 'send-btn stop-btn';
            discussBtn.innerHTML = '<img src="/static/icons/chat-off-line.svg" class="btn-icon-white" alt="Stop">Stop';
            discussBtn.onclick = stopDiscuss;
            sendBtn.disabled = true;
            input.value = '';
            input.disabled = true;
            
            // Add user message
            addMessageToChat('user', message);
            
            try {
                // Create conversation if needed
                if (!currentConversationId) {
                    const convResponse = await fetch('/api/conversations', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: message.substring(0, 50) })
                    });
                    const conv = await convResponse.json();
                    currentConversationId = conv.id;
                }
                
                // Start multi-turn discussion
                await runDiscussion();
                
            } catch (error) {
                if (error.name !== 'AbortError') {
                    showToast('Discussion error: ' + error.message, 'error');
                }
            }
        }
        
        async function runDiscussion() {
            const discussBtn = document.getElementById('discussBtn');
            const currentInstanceId = discussInstanceId;
            
            // Check if abort was requested or instance changed before starting
            if ((discussAbortController && discussAbortController.signal.aborted) ||
                discussInstanceId !== currentInstanceId) {
                return;
            }
            
            // Build discussion context with termination hints
            let context = `You are participating in a group discussion. The topic is: "${discussMessage}"\n\n`;
            context += `You are one of ${discussModels.length} models discussing this topic.\n`;
            context += `Please provide your response concisely and contribute to the discussion.\n`;
            context += `After your response, if you believe the discussion has reached a satisfactory conclusion, please end your message with "[CONCLUSION]" followed by a brief summary.\n`;
            context += `If more discussion is needed, end with "[CONTINUE]".\n\n`;
            
            // Add previous discussion context
            const messages = document.querySelectorAll('#chatMessages .message');
            messages.forEach(msg => {
                const author = msg.querySelector('.message-author, .message-model');
                const content = msg.querySelector('.message-content');
                if (author && content) {
                    context += `${author.textContent}: ${content.textContent}\n`;
                }
            });
            
            // Get current model for this round
            const modelIndex = discussCurrentRound % discussModels.length;
            const currentModel = discussModels[modelIndex];
            currentRespondingModel = currentModel;
            
            // Add round indicator
            const roundDiv = document.createElement('div');
            roundDiv.className = 'discuss-round';
            roundDiv.innerHTML = `<span style="color: #666; font-size: 12px;">Round ${discussCurrentRound + 1} - ${currentModel} responding...</span>`;
            document.getElementById('chatMessages').appendChild(roundDiv);
            
            // Update button text
            discussBtn.innerHTML = `<img src="/static/icons/chat-off-line.svg" class="btn-icon-white" alt="Stop">Stop (${currentModel})`;
            
            // Abort if this instance is no longer current before starting fetch
            if (discussInstanceId !== currentInstanceId) {
                roundDiv.remove();
                return;
            }
            
            // Stream response from current model
            // Only pass original_message on first round to avoid duplicate entries
            const requestBody = {
                message: context,
                models: [currentModel],
                conversation_id: currentConversationId
            };
            if (discussCurrentRound === 0) {
                requestBody.original_message = discussMessage;
            }
            const response = await fetch('/api/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody),
                signal: discussAbortController.signal
            });
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullContent = '';
            let messageElement = null;
            
            while (isDiscussMode) {
                const { done, value } = await reader.read();
                if (done) break;
                
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';
                
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = line.slice(6).trim();
                        if (!data) continue;
                        
                        try {
                            const json = JSON.parse(data);
                            
                            if (json.model && !messageElement) {
                                messageElement = addStreamingMessage('assistant', '', json.model);
                            }
                            
                            if (json.content !== undefined && messageElement) {
                                fullContent += json.content;
                                const contentDiv = messageElement.querySelector('.message-content');
                                if (contentDiv) {
                                    contentDiv.innerHTML = cleanMarkdown(fullContent);
                                    messageElement.scrollIntoView({ behavior: 'smooth', block: 'end' });
                                }
                            }
                            
                            if (json.full_content !== undefined) {
                                // Response complete
                                break;
                            }
                        } catch (e) {
                            // Skip malformed JSON
                        }
                    }
                }
            }
            
            // Remove round indicator
            roundDiv.remove();
            
            // Check for conclusion or continue marker
            const hasConclusion = fullContent.includes('[CONCLUSION]');
            const hasContinue = fullContent.includes('[CONTINUE]');
            
            // Update last summary if present
            if (hasConclusion) {
                const summaryMatch = fullContent.match(/\[CONCLUSION\]\s*(.*)/s);
                if (summaryMatch) {
                    lastDiscussionSummary = summaryMatch[1].trim();
                }
                // Track that current model has reached conclusion
                if (currentRespondingModel && !conclusionReachedModels.includes(currentRespondingModel)) {
                    conclusionReachedModels.push(currentRespondingModel);
                }
            }
            
            // Decision logic for next round
            if (!isDiscussMode) return;
            
            // Calculate minimum rounds: each model speaks at least twice
            const minRounds = discussModels.length * 2;
            
            // If model indicates CONTINUE, always continue discussion (if not at max rounds)
            if (hasContinue) {
                if (discussCurrentRound >= maxDiscussRounds - 1) {
                    stopDiscuss();
                    return;
                }
                discussCurrentRound++;
                await runDiscussion();
                return;
            }
            
            // If model indicates conclusion AND we've met minimum rounds
            if (hasConclusion && discussCurrentRound + 1 >= minRounds) {
                // Check if all selected models have reached conclusion
                const allConcluded = discussModels.every(m => conclusionReachedModels.includes(m));
                
                if (allConcluded) {
                    stopDiscuss();
                    return;
                }
                
                // If current model concluded but others haven't, continue to next model
                const nextModelIndex = discussModels.indexOf(currentRespondingModel) + 1;
                
                // Check if all remaining models have also concluded
                let allRemainingConcluded = true;
                for (let i = nextModelIndex; i < discussModels.length; i++) {
                    if (!conclusionReachedModels.includes(discussModels[i])) {
                        allRemainingConcluded = false;
                        break;
                    }
                }
                
                if (allRemainingConcluded) {
                    stopDiscuss();
                    return;
                }
            }
            
            // Check if we've reached max rounds
            if (discussCurrentRound >= maxDiscussRounds - 1) {
                stopDiscuss();
                return;
            }
            
            // Continue to next round
            discussCurrentRound++;
            await runDiscussion();
        }
        function stopDiscuss() {
            // Prevent multiple concurrent stop operations
            if (isStoppingDiscuss || !isDiscussMode) {
                return;
            }
            
            isStoppingDiscuss = true;
            
            // Invalidate this discussion instance and abort its pending fetch
            discussInstanceId++;
            if (discussAbortController) {
                discussAbortController.abort();
            }
            
            isDiscussMode = false;
            
            const discussBtn = document.getElementById('discussBtn');
            const sendBtn = document.getElementById('sendBtn');
            const input = document.getElementById('chatInput');
            
            discussMessage = '';
            discussModels = [];
            conclusionReachedModels = [];
            discussCurrentRound = 0;
            
            // Reset UI
            discussBtn.className = 'send-btn discuss-btn';
            discussBtn.innerHTML = '<img src="/static/icons/discuss-line.svg" class="btn-icon-white" alt="Discuss">Discuss';
            discussBtn.onclick = startDiscuss;
            sendBtn.disabled = false;
            input.disabled = false;
            
            isStoppingDiscuss = false;
            
            // Clear input
            input.value = '';
        }

        function addStreamingMessage(role, content, model = null) {
            const container = document.getElementById('chatMessages');
            const modelIcon = getModelIcon(model);
            const modelName = model || 'Assistant';
            const modelColor = getModelColor(model);

            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${role}`;
            messageDiv.innerHTML = `
                <div class="message-body">
                    <div class="message-header">
                        <span class="message-author" style="color: ${modelColor}">${modelIcon}${modelName}</span>
                        <div class="message-actions">
                            <button class="message-btn" onclick="copyMessage(this)" title="Copy">Copy</button>
                            <button class="message-btn" onclick="insertToEditor(this)" title="Insert to Editor">Insert</button>
                        </div>
                    </div>
                    <div class="message-content">${cleanMarkdown(content)}</div>
                </div>
            `;
            container.appendChild(messageDiv);
            messageDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
            return messageDiv;
        }

        function copyMessage(btn) {
            const content = btn.closest('.message').querySelector('.message-content').textContent;
            navigator.clipboard.writeText(content);
            showToast('Copied to clipboard!', 'success');
        }

        let isInsertingToEditor = false;
        
        function insertToEditor(btn) {
            if (isInsertingToEditor) return;
            isInsertingToEditor = true;
            
            const messageContent = btn.closest('.message').querySelector('.message-content');
            const htmlContent = messageContent.innerHTML;
            
            clearTimeout(autoSaveTimer);
            
            try {
                const currentLength = quill.getLength();
                
                // 使用 clipboard.convert 将 HTML 转换为带格式的 delta
                const delta = quill.clipboard.convert({ html: htmlContent });
                
                // 构建组合 delta：保留到 currentLength - 1（末尾），然后插入换行和内容
                const combinedOps = [
                    { retain: Math.max(0, currentLength - 1) },
                    { insert: '\n' },
                    ...delta.ops
                ];
                
                quill.updateContents({ ops: combinedOps }, Quill.sources.USER);
                
                // 获取最终长度并移动光标到末尾
                const finalLength = quill.getLength();
                quill.setSelection({ index: finalLength, length: 0 }, Quill.sources.SILENT);
                
            } catch (e) {
                console.error('Insert error:', e);
            }
            
            setTimeout(() => {
                if (currentDocumentId) {
                    saveDocument(true);
                }
                isInsertingToEditor = false;
            }, 500);
            
            showToast('Inserted into editor!', 'success');
        }

        async function saveSettings() {
            const apiKeys = {};
            const enabledModels = [];

            // Get existing settings to preserve existing API keys
            const settingsResponse = await fetch('/api/settings');
            const existingSettings = await settingsResponse.json();

            // Collect API keys and enabled models
            allModels.forEach(model => {
                const keyInput = document.getElementById(`${model.id}Key`);
                const enabledCheckbox = document.getElementById(`enabled_${model.id}`);

                // Only save if user entered a new key (not placeholder)
                if (keyInput && keyInput.value && keyInput.value !== '••••••••') {
                    apiKeys[model.id] = keyInput.value;
                } else if (existingSettings.api_keys && typeof existingSettings.api_keys[model.id] === 'string' && existingSettings.api_keys[model.id].trim()) {
                    // Preserve existing key only if it's a valid string
                    apiKeys[model.id] = existingSettings.api_keys[model.id];
                }
                if (enabledCheckbox && enabledCheckbox.checked) {
                    enabledModels.push(model.id);
                }
            });

            const settings = {
                api_keys: apiKeys,
                enabled_models: enabledModels
            };

            try {
                await fetch('/api/settings', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settings)
                });

                // Update currentSettings and selectedModels
                currentSettings = {
                    ...currentSettings,
                    api_keys: apiKeys,
                    enabled_models: enabledModels
                };
                selectedModels = enabledModels;
                renderModelSelector();

                closeSettings();
                showToast('Settings saved!', 'success');
            } catch (error) {
                showToast('Failed to save settings: ' + error.message, 'error');
            }
        }

        // Resizer
        function initResizer() {
            const resizer = document.getElementById('resizer');
            const chatPanel = document.querySelector('.chat-panel');
            let isResizing = false;

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                document.body.style.cursor = 'col-resize';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const containerWidth = document.querySelector('.main').offsetWidth;
                const newWidth = e.clientX;
                if (newWidth > 300 && newWidth < containerWidth - 300) {
                    chatPanel.style.width = newWidth + 'px';
                }
            });

            document.addEventListener('mouseup', () => {
                isResizing = false;
                document.body.style.cursor = '';
            });
        }

        // Toast
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Close modal on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeSettings();
            }
        });

        // Close modal on backdrop click
        document.getElementById('settingsModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                closeSettings();
            }
        });
    </script>
</body>
</html>
